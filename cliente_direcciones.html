<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cliente · Nonna Pastelería</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: { primary: "#5D1927", "background-light": "#FEBDC6", "background-dark": "#2D0A11" },
                fontFamily: { display: ["Inter", "sans-serif"] },
                borderRadius: { DEFAULT: "0.75rem" },
            },
        },
    };
</script>
<style>
    /* Estilos adicionales para transiciones suaves */
    .fade-enter { opacity: 0; }
    .fade-enter-active { opacity: 1; transition: opacity 0.3s; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-sans min-h-screen">
<header class="w-full py-4 px-6 lg:px-12 flex justify-between items-center bg-white/30 dark:bg-black/20 backdrop-blur-md sticky top-0 z-50 border-b border-primary/10">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white shadow-lg">
            <span class="material-icons-outlined">restaurant</span>
        </div>
        <span class="text-2xl font-bold text-primary dark:text-white">Nonna</span>
    </div>
    <a href="clientes.html" class="flex items-center gap-2 px-4 py-2 text-primary dark:text-pink-200 hover:bg-white/40 dark:hover:bg-white/10 rounded-full transition-all font-medium">
        <span class="material-icons-outlined text-sm">arrow_back</span>
        Volver a clientes
    </a>
</header>

<main class="max-w-6xl mx-auto px-6 lg:px-12 py-10">
    <!-- Cabecera con nombre del cliente -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-primary flex items-center gap-3">
            <span class="material-icons-outlined text-4xl">person</span>
            <span id="cliente-nombre">Cargando...</span>
        </h1>
        <p class="text-primary/70 mt-1 ml-12">Panel de cliente</p>
    </div>

    <!-- Grid de dos columnas: Direcciones y Pedidos -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Columna izquierda: Direcciones -->
        <section class="bg-white dark:bg-neutral-900/80 rounded-2xl shadow-xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="material-icons-outlined">location_on</span>
                    Direcciones
                </h2>
                <button id="btn-agregar-direccion" class="bg-primary text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-primary/90 transition">
                    <span class="material-icons-outlined">add</span> Nueva
                </button>
            </div>
            <div id="lista-direcciones" class="space-y-4">
                <p class="text-slate-500">Cargando direcciones...</p>
            </div>
        </section>

        <!-- Columna derecha: Pedidos -->
        <section class="bg-white dark:bg-neutral-900/80 rounded-2xl shadow-xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="material-icons-outlined">shopping_bag</span>
                    Pedidos recientes
                </h2>
                <button id="btn-recargar-pedidos" class="text-primary hover:bg-primary/10 p-2 rounded-full transition" title="Actualizar">
                    <span class="material-icons-outlined">refresh</span>
                </button>
            </div>
            <div id="lista-pedidos" class="space-y-4">
                <p class="text-slate-500">Cargando pedidos...</p>
            </div>
        </section>
    </div>
</main>

<script>
    const API_BASE = 'http://3.15.13.161:8000/api';
    const TOKEN = localStorage.token;

    function getHeaders() {
        return { 
            'accept': 'application/json', 
            'Authorization': `Bearer ${TOKEN}`, 
            'Content-Type': 'application/json' 
        };
    }

    // Obtener ID del cliente desde URL
    const urlParams = new URLSearchParams(window.location.search);
    const clienteId = urlParams.get('id');
    if (!clienteId) {
        alert('No se especificó cliente');
        window.location.href = 'clientes.html';
    }

    let clienteNombreGlobal = '';

    // --- Cargar datos del cliente ---
    async function cargarCliente() {
        try {
            const res = await fetch(`${API_BASE}/cliente/${clienteId}`, { headers: getHeaders() });
            if (res.ok) {
                const cliente = await res.json();
                clienteNombreGlobal = `${cliente.nombre || ''} ${cliente.apellido || ''}`.trim() || `Cliente #${clienteId}`;
                document.getElementById('cliente-nombre').innerText = clienteNombreGlobal;
            } else {
                document.getElementById('cliente-nombre').innerText = `Cliente #${clienteId}`;
            }
        } catch(e) { 
            console.error('Error cargando cliente:', e);
            document.getElementById('cliente-nombre').innerText = `Cliente #${clienteId}`;
        }
    }

    // --- Cargar y mostrar direcciones (existente) ---
    async function cargarDirecciones() {
        const container = document.getElementById('lista-direcciones');
        try {
            const res = await fetch(`${API_BASE}/direccion/`, { headers: getHeaders() });
            if (!res.ok) throw new Error('Error al obtener direcciones');
            const todas = await res.json();
            const misDirecciones = todas.filter(d => d.id_cliente == clienteId);
            
            if (misDirecciones.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic">No hay direcciones registradas.</p>';
                return;
            }
            
            container.innerHTML = '';
            misDirecciones.forEach(dir => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-start p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-primary/10 hover:shadow-md transition';
                div.innerHTML = `
                    <div class="flex-1">
                        <p class="font-semibold text-slate-800 dark:text-white">${escapeHtml(dir.descripcion)}</p>
                        <p class="text-xs text-slate-500 mt-1">ID: ${dir.id_direccion}</p>
                    </div>
                    <button class="eliminar-direccion text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded-full transition" data-id="${dir.id_direccion}" title="Eliminar dirección">
                        <span class="material-icons-outlined">delete</span>
                    </button>
                `;
                container.appendChild(div);
            });

            // Asignar eventos de eliminar
            document.querySelectorAll('.eliminar-direccion').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm('¿Eliminar esta dirección permanentemente?')) {
                        const idDir = btn.dataset.id;
                        try {
                            const resp = await fetch(`${API_BASE}/direccion/${idDir}`, { 
                                method: 'DELETE', 
                                headers: getHeaders() 
                            });
                            if (resp.ok) {
                                cargarDirecciones();
                            } else {
                                alert('No se pudo eliminar la dirección.');
                            }
                        } catch (error) {
                            alert('Error de conexión');
                        }
                    }
                });
            });

        } catch(e) {
            container.innerHTML = '<p class="text-red-500">Error al cargar direcciones</p>';
            console.error(e);
        }
    }

    // --- NUEVO: Cargar y mostrar pedidos del cliente ---
    async function cargarPedidos() {
        const container = document.getElementById('lista-pedidos');
        container.innerHTML = '<p class="text-slate-500">Cargando pedidos...</p>';
        
        try {
            const res = await fetch(`${API_BASE}/pedidos/`, { headers: getHeaders() });
            if (!res.ok) throw new Error('Error al obtener pedidos');
            const todosPedidos = await res.json();
            
            // Filtrar por id_cliente (asumiendo que el campo es id_cliente)
            const misPedidos = todosPedidos.filter(p => p.id_cliente == clienteId);
            
            if (misPedidos.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic">No hay pedidos registrados para este cliente.</p>';
                return;
            }

            // Ordenar por fecha de pedido descendente
            misPedidos.sort((a, b) => new Date(b.fecha_pedido) - new Date(a.fecha_pedido));
            
            container.innerHTML = '';
            
            misPedidos.forEach(pedido => {
                // Mapeo de estado (puedes ajustar según tu API)
                const estadoClase = {
                    2: 'bg-yellow-100 text-yellow-800',
                    3: 'bg-blue-100 text-blue-800',
                    5: 'bg-green-100 text-green-800',
                    6: 'bg-red-100 text-red-800'
                }[pedido.id_estado] || 'bg-gray-100 text-gray-800';
                
                const estadoTexto = {
                    2: 'Pendiente',
                    3: 'En proceso',
                    5: 'Entregado',
                    6: 'Cancelado'
                }[pedido.id_estado] || `Estado ${pedido.id_estado}`;
                
                // Formatear fechas
                const fechaPedido = pedido.fecha_pedido ? new Date(pedido.fecha_pedido).toLocaleDateString('es-MX', {day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
                const fechaEntrega = pedido.fecha_entrega ? new Date(pedido.fecha_entrega).toLocaleDateString('es-MX', {day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
                
                // Productos (si viene como array de strings o array de objetos)
                let productosHtml = '';
                if (Array.isArray(pedido.productos) && pedido.productos.length > 0) {
                    const listaProductos = pedido.productos.map(p => typeof p === 'string' ? p : p.nombre || p.descripcion || 'Producto').join(', ');
                    productosHtml = `<p class="text-xs text-slate-500 mt-2"><span class="font-medium">Productos:</span> ${escapeHtml(listaProductos)}</p>`;
                }
                
                // Construir tarjeta de pedido
                const tarjeta = document.createElement('div');
                tarjeta.className = 'border border-primary/10 rounded-xl p-4 bg-slate-50 dark:bg-slate-800 hover:shadow-md transition';
                tarjeta.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-primary">Pedido #${pedido.id_pedido}</span>
                                <span class="text-xs px-2 py-1 rounded-full ${estadoClase}">${estadoTexto}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 mt-2 text-sm">
                                <span class="text-slate-500">Pedido:</span>
                                <span class="text-slate-700 dark:text-slate-300">${fechaPedido}</span>
                                <span class="text-slate-500">Entrega:</span>
                                <span class="text-slate-700 dark:text-slate-300">${fechaEntrega}</span>
                                <span class="text-slate-500">Total:</span>
                                <span class="font-semibold text-primary">$${pedido.total?.toFixed(2) || '0.00'}</span>
                            </div>
                            ${productosHtml}
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="text-xs bg-primary/10 text-primary px-2 py-1 rounded-full">
                                ${pedido.tipo_entrega ? '🏠 Domicilio' : '🏪 Recoger'}
                            </span>
                            <!-- Botón opcional para ver detalle completo (puedes enlazar a paginaPedido.html) -->
                            <a href="paginaPedido.html?id=${pedido.id_pedido}" class="text-primary hover:underline text-sm flex items-center gap-1 mt-1" target="_blank">
                                <span class="material-icons-outlined text-base">visibility</span> Ver
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(tarjeta);
            });
            
        } catch (error) {
            console.error('Error cargando pedidos:', error);
            container.innerHTML = '<p class="text-red-500">Error al cargar pedidos</p>';
        }
    }

    // --- Modal para agregar dirección (existente, mejorado) ---
    function mostrarModalAgregarDireccion() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4';
        modalDiv.innerHTML = `
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="material-icons-outlined">add_location</span>
                    Nueva Dirección
                </h3>
                <label class="block text-sm font-medium mb-1">Dirección completa</label>
                <textarea id="nueva-descripcion" class="w-full border rounded-xl p-3 dark:bg-slate-700 dark:border-slate-600" rows="3" placeholder="Calle, número, colonia, ciudad, CP..."></textarea>
                <p class="text-xs text-slate-500 mt-1">Ej: Av. Siempre Viva 123, Col. Centro, CDMX, 06000</p>
                <div class="flex justify-end gap-3 mt-6">
                    <button id="cancelar-modal" class="px-4 py-2 border rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition">Cancelar</button>
                    <button id="confirmar-modal" class="px-4 py-2 bg-primary text-white rounded-xl hover:bg-primary/90 transition flex items-center gap-2">
                        <span class="material-icons-outlined text-sm">save</span> Guardar
                    </button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        
        const cerrarModal = () => modalDiv.remove();
        modalDiv.querySelector('#cancelar-modal').onclick = cerrarModal;
        modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) cerrarModal(); });
        
        modalDiv.querySelector('#confirmar-modal').onclick = async () => {
            const descripcion = modalDiv.querySelector('#nueva-descripcion').value.trim();
            if (!descripcion) { 
                alert('La dirección es obligatoria'); 
                return; 
            }
            try {
                const resp = await fetch(`${API_BASE}/direccion/`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ 
                        id_cliente: parseInt(clienteId), 
                        descripcion: descripcion 
                    })
                });
                if (resp.ok) {
                    cerrarModal();
                    cargarDirecciones();
                } else {
                    const error = await resp.json();
                    alert('Error: ' + (error.detail || 'No se pudo guardar'));
                }
            } catch(e) { 
                alert('Error de conexión'); 
            }
        };
    }

    // Función de escape para HTML
    function escapeHtml(str) { 
        if (!str) return ''; 
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // --- Inicialización y eventos ---
    document.addEventListener('DOMContentLoaded', () => {
        cargarCliente();
        cargarDirecciones();
        cargarPedidos();
        
        document.getElementById('btn-agregar-direccion').addEventListener('click', mostrarModalAgregarDireccion);
        document.getElementById('btn-recargar-pedidos').addEventListener('click', cargarPedidos);
    });

    // Atajos globales (por si se usan desde consola)
    window.recargarDatos = () => {
        cargarDirecciones();
        cargarPedidos();
    };
</script>
</body>
</html>
